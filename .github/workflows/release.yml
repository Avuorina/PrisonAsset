# リソースパックの zip を作ってリリースに置く
#   main に push したとき(パックの中身が変わったとき) : リリース「latest」を作り直す(URL は変わらない)
#   v から始まるタグ(v1, v2 …)を push したとき       : そのタグのリリースを作る(固定版)
#   zip の一番上に pack.mcmeta と assets/ が来るようにする(サーバー配布用)
#   リリースの説明に SHA-1 と server.properties に書く行を出す
name: Release resource pack

on:
  push:
    branches:
      - main
    paths:
      - "pack.mcmeta"
      - "pack.png"
      - "assets/**"
      - ".github/workflows/release.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: zip を作る
        run: |
          zip -r -X PrisonAsset.zip pack.mcmeta assets
          [ -f pack.png ] && zip -X PrisonAsset.zip pack.png || true
          echo "SHA1=$(sha1sum PrisonAsset.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: リリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # タグの push ならそのタグ、それ以外(main への push・手動実行)は latest を作り直す
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="latest"
            gh release delete latest --cleanup-tag --yes || true
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/PrisonAsset.zip"
          cat > notes.md <<NOTES
          ## server.properties に書く行

          \`\`\`properties
          require-resource-pack=true
          resource-pack=${URL}
          resource-pack-sha1=${SHA1}
          \`\`\`

          SHA-1: \`${SHA1}\`
          NOTES
          gh release create "$TAG" PrisonAsset.zip --target "${GITHUB_SHA}" --title "PrisonAsset $TAG" --notes-file notes.md
